name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Resolve Cloudflare account ID
        id: cloudflare-account
        run: |
          set -euo pipefail
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "account_id=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          accounts_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100")"
          account_count="$(jq '.result | length' <<< "$accounts_json")"
          if [[ "$account_count" != "1" ]]; then
            echo "Set CLOUDFLARE_ACCOUNT_ID or ensure the API token can access exactly one account." >&2
            exit 1
          fi
          account_id="$(jq -er '.result[0].id | select(type == "string" and length > 0)' <<< "$accounts_json")"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$COMPANIES_HOUSE_API_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      - name: Create or reuse Worker KV namespaces
        id: kv-namespaces
        run: |
          set -euo pipefail

          ensure_namespace() {
            local title="$1"
            local list_response count namespace_id create_response
            list_response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=1000")"
            count="$(jq --arg title "$title" '[.result[] | select(.title == $title)] | length' <<< "$list_response")"
            if [[ "$count" == "1" ]]; then
              jq -er --arg title "$title" '.result[] | select(.title == $title) | .id | select(type == "string" and test("^[a-f0-9]{32}$"))' <<< "$list_response"
              return
            fi
            if [[ "$count" != "0" ]]; then
              echo "Multiple KV namespaces named $title were found." >&2
              return 1
            fi

            create_response="$(curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"title\":\"$title\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
            jq -e '.success == true' <<< "$create_response" >/dev/null
            jq -er '.result.id | select(type == "string" and test("^[a-f0-9]{32}$"))' <<< "$create_response"
          }

          kyb_cache_id="$(ensure_namespace KYB_CACHE)"
          api_keys_id="$(ensure_namespace API_KEYS)"
          python3 - "$kyb_cache_id" "$api_keys_id" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          for binding, namespace_id in zip(("KYB_CACHE", "API_KEYS"), sys.argv[1:]):
              pattern = re.compile(
                  rf'(?ms)(\[\[kv_namespaces\]\]\s*binding = "{binding}"\s*id = ")[^"]+(")'
              )
              text, replacements = pattern.subn(rf"\g<1>{namespace_id}\g<2>", text)
              if replacements != 1:
                  raise SystemExit(f"Expected exactly one KV binding for {binding}")
          path.write_text(text)
          PY
          echo "api_keys_id=$api_keys_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
      - name: Ensure workers.dev subdomain
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          response="$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$endpoint")"
          existing_subdomain="$(jq -er '.result.subdomain | select(type == "string" and length > 0)' <<< "$response" 2>/dev/null || true)"
          if [[ -n "$existing_subdomain" ]]; then
            echo "Using existing workers.dev subdomain."
            exit 0
          fi

          error_code="$(jq -r '.errors[0].code // empty' <<< "$response")"
          if [[ "$error_code" != "10007" ]]; then
            echo "Could not confirm the account's workers.dev subdomain; refusing to change account settings." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"agentguard-api"}' \
            "$endpoint" >/dev/null
          echo "Registered the authorized workers.dev subdomain."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-account.outputs.account_id }}
          command: deploy
          secrets: COMPANIES_HOUSE_API_KEY
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      - name: Live API smoke test with temporary Bearer key
        run: |
          set -euo pipefail
          api_base="https://agent-guard-api.agentguard-api.workers.dev"
          temporary_key="agentguard-live-smoke-$(openssl rand -hex 24)"
          kv_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$API_KEYS_NAMESPACE/values/$temporary_key"
          response_file="$(mktemp)"
          key_created=0

          cleanup() {
            local result=$?
            trap - EXIT
            if [[ "$key_created" == "1" ]]; then
              if curl --fail --silent --show-error \
                -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$kv_url" >/dev/null; then
                echo "Temporary API key removed from KV."
              else
                echo "Failed to remove temporary API key from KV." >&2
                result=1
              fi
            fi
            rm -f "$response_file"
            exit "$result"
          }
          trap cleanup EXIT

          put_result="$(curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-binary "temporary-live-test-key" \
            "$kv_url")"
          jq -e '.success == true' <<< "$put_result" >/dev/null
          key_created=1

          check_endpoint() {
            local name="$1" path="$2" payload="$3" validator="$4" status
            status="$(curl --silent --show-error \
              -o "$response_file" \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $temporary_key" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$api_base$path")"
            if [[ "$status" != "200" ]] || ! jq -e "$validator" "$response_file" >/dev/null; then
              echo "FAIL $name: HTTP $status or unexpected JSON response" >&2
              return 1
            fi
            echo "PASS $name: HTTP 200"
          }

          check_endpoint \
            "sanitize" \
            "/v1/sanitize" \
            '{"text":"agentguard live test","strip_pii":false}' \
            '.clean_text == "agentguard live test" and (.threat_score | type == "number")'
          check_endpoint \
            "verify-uk-company 00445790" \
            "/v1/verify-uk-company" \
            '{"company_number":"00445790"}' \
            '.verified == true and (.compliance_pass | type == "boolean") and (.company_name | type == "string")'
          check_endpoint \
            "uk-deep-kyb" \
            "/v1/uk-deep-kyb" \
            '{"company_number":"00445790"}' \
            '.verified == true and (.risk_score | type == "number") and (.risk_flags | type == "array") and (.active_directors_count | type == "number") and (.psc_count | type == "number")'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
          API_KEYS_NAMESPACE: ${{ steps.kv-namespaces.outputs.api_keys_id }}
